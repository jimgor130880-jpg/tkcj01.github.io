<!DOCTYPE html>
<html lang="zh-CN" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>试试你的运气 | 幸运大抽奖</title>
    <style>
        body {
            background-color: #1E4198;
            margin: 0;
            padding: 10px;
            font-family: Arial, sans-serif;
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
            direction: ltr;
        }
        body.ar {
            direction: rtl;
            font-family: 'Arial', 'Tahoma', sans-serif;
        }
        .language-switcher {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
            display: flex;
            gap: 4px;
        }
        body.ar .language-switcher {
            right: auto;
            left: 10px;
        }
        .lang-btn {
            background-color: #FFC100;
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            font-size: 12px;
            flex-shrink: 0;
        }
        .lang-btn:hover {
            background-color: #FFD700;
            transform: scale(1.05);
        }
        .lang-btn.active {
            background-color: #E62E2E;
            color: #FFD900;
        }
        .header {
            text-align: center;
            margin-bottom: 15px;
            padding-top: 40px;
        }
        .title {
            background-color: #E62E2E;
            color: #FFD900;
            font-size: 20px;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 4px;
            display: inline-block;
            margin: 0;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-template-rows: repeat(7, 50px);
            gap: 8px;
            justify-content: center;
            align-items: center;
        }
        .grid-item {
            background-color: #E62E2E;
            color: #FFD900;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            position: relative;
            padding: 3px 0;
            cursor: default;
            transition: all 0.15s ease;
            box-sizing: border-box;
            text-align: center;
            width: 100%;
            height: 100%;
        }
        /* 格子序号样式：左上角小数字，低调不突兀 */
        .grid-item::before {
            content: attr(data-num);
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 8px;
            font-weight: bold;
            color: #fff;
            opacity: 0.8;
            z-index: 5;
            line-height: 1;
        }
        /* 阿拉伯语序号调整到右上角 */
        body.ar .grid-item::before {
            left: auto;
            right: 4px;
        }
        .empty {
            background-color: transparent;
            width: 100%;
            height: 100%;
        }
        .image-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            border-radius: 4px;
            overflow: hidden;
            grid-column: 2 / 3;
            grid-row: 4 / 5;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .start-btn {
            background-color: #FFC100;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            padding: 10px 70px;
            border: none;
            border-radius: 4px;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }
        .start-btn:disabled {
            background-color: #999;
            color: #666;
            cursor: not-allowed;
            transform: scale(1);
        }
        .start-btn:hover:not(:disabled) {
            background-color: #FFD700;
            transform: scale(1.02);
        }
        .start-btn:active:not(:disabled) {
            transform: scale(0.98);
        }
        .btn-container {
            text-align: center;
            padding-bottom: 20px;
        }
        .icon {
            width: 15px;
            height: 15px;
            background-color: #FFC100;
            border-radius: 50% 50% 50% 0;
            position: absolute;
            z-index: 5;
        }
        .icon-left { top: 120px; left: 10px; }
        .icon-right { top: 200px; right: 10px; }
        body.ar .icon-left { left: auto; right: 10px; }
        body.ar .icon-right { right: auto; left: 10px; }
        .star {
            color: #fff;
            position: absolute;
            font-size: 14px;
            z-index: 5;
        }
        .star1 { top: 60px; left: 10px; }
        .star2 { bottom: 40px; right: 10px; }
        .star3 { bottom: 15px; left: 10px; }
        .star4 { right: 10px; top: 300px; }
        body.ar .star1 { left: auto; right: 10px; }
        body.ar .star2 { right: auto; left: 10px; }
        body.ar .star3 { left: auto; right: 10px; }
        body.ar .star4 { right: auto; left: 10px; }
        .grid-item.active {
            background-color: #FFD900;
            color: #E62E2E;
            transform: scale(1.05);
            box-shadow: 0 0 12px #FFD900;
            z-index: 10;
        }
        .grid-item.win {
            background-color: #FF0000;
            color: #FFFFFF;
            box-shadow: 0 0 15px #FF0000, 0 0 25px #FF0000;
            transform: scale(1.05);
            z-index: 20;
        }
        .grid-item.flipped {
            background-color: #FFFFFF !important;
            font-weight: bold;
            border-radius: 4px;
            transform: scale(1);
            z-index: 25;
            animation: flipFlash 1.2s ease-in-out infinite alternate;
        }
        .color-black { color: #000000 !important; }
        .color-yellow { color: #FFD900 !important; }
        .color-orange { color: #FF7F00 !important; }
        .color-blue { color: #0066FF !important; }
        .color-red { color: #E62E2E !important; }
        .grid-item.shuffle-show {
            background-color: #FFFFFF;
            font-weight: bold;
            border-radius: 4px;
            transform: scale(1);
            z-index: 25;
        }
        @keyframes flashOnce {
            from { opacity: 1; transform: scale(1.05); }
            to { opacity: 0.5; transform: scale(1.12); }
        }
        @keyframes flipFlash {
            from { box-shadow: 0 0 8px #FFFFFF, 0 0 12px #E62E2E; opacity: 1; }
            to { box-shadow: 0 0 20px #FFFFFF, 0 0 30px #E62E2E; opacity: 0.95; }
        }
        .prize-text {
            font-size: 13px;
            line-height: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            width: 100%;
            padding: 0 3px;
        }
        .prize-top { font-size: 12px; }
        .prize-bottom { font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
        /* 奖品内图片样式：适配格子大小，不拉伸 */
        .prize-img {
            width: 20px;
            height: 20px;
            object-fit: cover;
            border-radius: 2px;
            flex-shrink: 0;
        }
        * {
            overflow-wrap: break-word;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="language-switcher">
        <button class="lang-btn active" id="cnBtn">中文</button>
        <button class="lang-btn" id="enBtn">English</button>
        <button class="lang-btn" id="arBtn">العربية</button>
    </div>
    
    <div class="icon icon-left"></div>
    <div class="icon icon-right"></div>
    <div class="star star1">★</div>
    <div class="star star2">★</div>
    <div class="star star3">★</div>
    <div class="star star4">★</div>
    
    <div class="header">
        <div class="title" id="mainTitle">试试你的运气</div>
    </div>

    <div class="grid-container">
        <div class="grid-item" data-num="1">？</div>
        <div class="grid-item" data-num="2">？</div>
        <div class="grid-item" data-num="3">？</div>
        <div class="grid-item" data-num="4">？</div>
        <div class="empty"></div>
        <div class="grid-item" data-num="5">？</div>
        <div class="grid-item" data-num="6">？</div>
        <div class="empty"></div>
        <div class="grid-item" data-num="7">？</div>
        <div class="grid-item" data-num="8">？</div>
        <div class="image-container">
            <img src="a1.png" alt="装饰图片" onerror="this.style.display='none'">
        </div>
        <div class="grid-item" data-num="9">？</div>
        <div class="grid-item" data-num="10">？</div>
        <div class="empty"></div>
        <div class="grid-item" data-num="11">？</div>
        <div class="grid-item" data-num="12">？</div>
        <div class="empty"></div>
        <div class="grid-item" data-num="13">？</div>
        <div class="grid-item" data-num="14">？</div>
        <div class="grid-item" data-num="15">？</div>
        <div class="grid-item" data-num="16">？</div>
    </div>

    <div class="btn-container">
        <button class="start-btn" id="startBtn">开始</button>
    </div>

    <script>
        const CONFIG = {
            luckyPath: [1,2,3,5,7,9,11,13,16,15,14,12,10,8,6,4,1],
            flashTimes: 5,
            flashInterval: 180,
            showPrizeTime: 2000,
            rollTime: [1000, 1300],
            prizeProbability: {
                "100粉丝": 78,
                "1000粉丝": 12,
                "5000粉丝": 6,
                "10000粉丝": 3,
                "100000粉丝": 1
            },
            shufflePrizePool: [
                "100粉丝", "100粉丝", "100粉丝", "100粉丝", "100粉丝",
                "100粉丝", "100粉丝", "1000粉丝", "1000粉丝", "1000粉丝",
                "5000粉丝", "5000粉丝", "10000粉丝", "10000粉丝", "100000粉丝", "100粉丝"
            ],
            prizeColor: {
                "100粉丝": "black",
                "1000粉丝": "yellow",
                "5000粉丝": "orange",
                "10000粉丝": "blue",
                "100000粉丝": "red"
            },
            lang: {
                cn: {
                    title: "试试你的运气",
                    start: "开始",
                    shuffle: "洗牌",
                    unknown: "？",
                    prizePrefix: "获得",
                    prize: {
                        "100粉丝": "100粉丝",
                        "1000粉丝": "1000粉丝",
                        "5000粉丝": "5000粉丝",
                        "10000粉丝": "10000粉丝",
                        "100000粉丝": "100000粉丝"
                    },
                    tip: {
                        clearRecord: "✅ 中奖记录功能已移除！",
                        checkProb: "概率验证完成！请查看控制台日志（按F12打开）",
                        probLog1: "概率验证结果（共",
                        probLog2: "次）：",
                        probLog3: "粉丝：",
                        probLog4: "次 ("
                    }
                },
                en: {
                    title: "Try Your Luck",
                    start: "Start",
                    shuffle: "Shuffle",
                    unknown: "?",
                    prizePrefix: "", // 核心修改：移除Win前缀，设为空
                    prize: {
                        "100粉丝": "100 SEG",
                        "1000粉丝": "1000 SEG",
                        "5000粉丝": "5000 SEG",
                        "10000粉丝": "10000 SEG",
                        "100000粉丝": "100000 SEG"
                    },
                    tip: {
                        clearRecord: "✅ Winning record function has been removed!",
                        checkProb: "Probability verification completed! Please check console log (press F12 to open)",
                        probLog1: "Probability verification result (total ",
                        probLog2: " times):",
                        probLog3: " SEG: ",
                        probLog4: " times ("
                    }
                },
                ar: {
                    title: "جرب حظك",
                    start: "ابدأ",
                    shuffle: "خلط",
                    unknown: "؟",
                    prizePrefix: "فوز ",
                    prize: {
                        "100粉丝": "100 متابع",
                        "1000粉丝": "1000 متابع",
                        "5000粉丝": "5000 متابع",
                        "10000粉丝": "10000 متابع",
                        "100000粉丝": "100000 متابع"
                    },
                    tip: {
                        clearRecord: "✅ تم إزالة وظيفة سجل الفوز!",
                        checkProb: "تم إكمال التحقق من الاحتمالية! يرجى التحقق من سجل وحدة التحكم (اضغط F12 لفتحه)",
                        probLog1: "نتيجة التحقق من الاحتمالية (مجموع ",
                        probLog2: " مرة):",
                        probLog3: " متابع: ",
                        probLog4: " مرة ("
                    }
                }
            }
        };

        let currentLang = "cn";
        let isRunning = false;
        let isShuffleMode = false;
        let gridPrizeMap = {};
        const el = {
            startBtn: document.getElementById('startBtn'),
            mainTitle: document.getElementById('mainTitle'),
            cnBtn: document.getElementById('cnBtn'),
            enBtn: document.getElementById('enBtn'),
            arBtn: document.getElementById('arBtn'),
            body: document.body,
            gridItems: document.querySelectorAll('.grid-item')
        };

        initShufflePrizeMap();
        bindEvents();

        function initShufflePrizeMap() {
            const shuffled = [...CONFIG.shufflePrizePool].sort(() => Math.random() - 0.5);
            el.gridItems.forEach((item, idx) => {
                gridPrizeMap[item.dataset.num] = shuffled[idx];
            });
        }

        function switchLanguage(lang) {
            if (lang === currentLang) return;
            currentLang = lang;
            el.body.className = lang;
            [el.cnBtn, el.enBtn, el.arBtn].forEach(btn => {
                btn.classList.toggle('active', btn.id === `${lang}Btn`);
            });
            el.mainTitle.textContent = CONFIG.lang[lang].title;
            el.startBtn.textContent = isShuffleMode ? CONFIG.lang[lang].shuffle : CONFIG.lang[lang].start;
            el.gridItems.forEach(item => {
                if (/[？?؟]/.test(item.innerHTML)) item.innerHTML = CONFIG.lang[lang].unknown;
            });
            document.title = `${CONFIG.lang[lang].title} | ${currentLang === 'cn' ? '幸运大抽奖' : currentLang === 'en' ? 'Lucky Draw' : 'السحب الحظي'}`;
        }

        function getPrizeByProbability() {
            const pool = [];
            Object.entries(CONFIG.prizeProbability).forEach(([prize, prob]) => {
                pool.push(...Array(prob).fill(prize));
            });
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function getPrizeName(prizeId) {
            return CONFIG.lang[currentLang].prize[prizeId] || prizeId;
        }

        function getPrizeColorClass(prizeId) {
            return `color-${CONFIG.prizeColor[prizeId] || 'black'}`;
        }

        function generatePrizeHtml(prizeId) {
            const prefix = CONFIG.lang[currentLang].prizePrefix;
            const name = getPrizeName(prizeId);
            // 英文：仅展示SEG文字+a1.png；中/阿文：前缀+奖品名称，纯文字
            const prizeContent = currentLang === 'en' 
                ? `<span>${name}</span><img src="a1.png" alt="${name}" class="prize-img" onerror="this.style.display='none'">`
                : name;
            return `
                <div class="prize-text">
                    ${prefix ? `<span class="prize-top">${prefix}</span>` : ''}
                    <span class="prize-bottom ${getPrizeColorClass(prizeId)}">${prizeContent}</span>
                </div>
            `;
        }

        function getItemByNum(num) {
            return document.querySelector(`.grid-item[data-num="${num}"]`);
        }

        function flashElement(targetItem, times, interval) {
            return new Promise(resolve => {
                let count = 0;
                const timer = setInterval(() => {
                    targetItem.style.animation = count % 2 === 0 
                        ? 'flashOnce 0.15s ease-out forwards' : 'none';
                    count++;
                    if (count >= times * 2) {
                        clearInterval(timer);
                        targetItem.style.animation = 'none';
                        resolve();
                    }
                }, interval);
            });
        }

        function resetAllGridItems() {
            el.gridItems.forEach(item => {
                item.classList.remove('active', 'win', 'flipped', 'shuffle-show', 
                    'color-black', 'color-yellow', 'color-orange', 'color-blue', 'color-red');
                item.style.animation = 'none';
                item.innerHTML = CONFIG.lang[currentLang].unknown;
            });
        }

        async function shufflePrizes() {
            if (isRunning) return;
            isRunning = true;
            el.startBtn.disabled = true;
            resetAllGridItems();

            for (const item of el.gridItems) {
                const prizeId = gridPrizeMap[item.dataset.num];
                item.classList.add('shuffle-show');
                item.innerHTML = generatePrizeHtml(prizeId);
                await new Promise(resolve => setTimeout(resolve, 100));
            }

            await new Promise(resolve => setTimeout(resolve, CONFIG.showPrizeTime));
            for (let i = el.gridItems.length - 1; i >= 0; i--) {
                const item = el.gridItems[i];
                item.classList.remove('shuffle-show');
                item.innerHTML = CONFIG.lang[currentLang].unknown;
                await new Promise(resolve => setTimeout(resolve, 80));
            }

            initShufflePrizeMap();
            isShuffleMode = false;
            el.startBtn.textContent = CONFIG.lang[currentLang].start;
            isRunning = false;
            el.startBtn.disabled = false;
        }

        async function startLuckyDraw() {
            if (isRunning) return;
            isRunning = true;
            el.startBtn.disabled = true;
            resetAllGridItems();

            const [minT, maxT] = CONFIG.rollTime;
            const totalTime = minT + Math.floor(Math.random() * (maxT - minT + 1));
            const startTime = Date.now();
            let pathIndex = 0;
            let speed = 10;

            function run() {
                const passTime = Date.now() - startTime;
                const progress = passTime / totalTime;

                getItemByNum(CONFIG.luckyPath[pathIndex])?.classList.remove('active');
                pathIndex = (pathIndex + 1) % CONFIG.luckyPath.length;
                const currNum = CONFIG.luckyPath[pathIndex];
                const currItem = getItemByNum(currNum);
                currItem?.classList.add('active');

                speed = 10 + progress * 110;

                if (passTime >= totalTime) {
                    el.gridItems.forEach(item => item.classList.remove('active'));
                    currItem.classList.add('win');
                    const winPrizeId = getPrizeByProbability();
                    flashElement(currItem, CONFIG.flashTimes, CONFIG.flashInterval).then(() => {
                        currItem.classList.remove('win');
                        currItem.classList.add('flipped');
                        currItem.innerHTML = generatePrizeHtml(winPrizeId);
                        isShuffleMode = true;
                        el.startBtn.textContent = CONFIG.lang[currentLang].shuffle;
                        isRunning = false;
                        el.startBtn.disabled = false;
                    });
                    return;
                }
                requestAnimationFrame(() => setTimeout(run, speed));
            }
            run();
        }

        function bindEvents() {
            el.cnBtn.addEventListener('click', () => switchLanguage('cn'));
            el.enBtn.addEventListener('click', () => switchLanguage('en'));
            el.arBtn.addEventListener('click', () => switchLanguage('ar'));
            el.startBtn.addEventListener('click', () => {
                isShuffleMode ? shufflePrizes() : startLuckyDraw();
            });
        }

        window.clearRecord = function() {
            alert(CONFIG.lang[currentLang].tip.clearRecord);
        }
        window.checkProbability = function(times = 10000) {
            const result = Object.keys(CONFIG.prizeProbability).reduce((obj, key) => {
                obj[key] = 0;
                return obj;
            }, {});
            for(let i=0; i<times; i++) {
                result[getPrizeByProbability()]++;
            }
            console.log(`${CONFIG.lang[currentLang].tip.probLog1}${times}${CONFIG.lang[currentLang].tip.probLog2}`);
            Object.entries(result).forEach(([prizeId, count]) => {
                const rate = (count / times * 100).toFixed(2);
                const prizeName = getPrizeName(prizeId).replace(CONFIG.lang[currentLang].prizePrefix, '');
                console.log(`${prizeName}${CONFIG.lang[currentLang].tip.probLog3}${count}${CONFIG.lang[currentLang].tip.probLog4}${rate}%)`);
            });
            alert(CONFIG.lang[currentLang].tip.checkProb);
        }
    </script>
</body>
</html>
